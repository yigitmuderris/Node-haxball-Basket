services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: haxball
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      POSTGRES_DB: haxball

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haxball -d haxball"]
      interval: 5s
      timeout: 3s
      retries: 10


  bot1:
    build: .
    env_file:
      - .env
    restart: unless-stopped

    command: ["node", "basket_en.js"]

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgres://haxball:${DB_PASSWORD}@db:5432/haxball
      DATA_DIR: /data

    volumes:
      - ./data/bot1:/data
      - ./logs:/app/logs

    ports:
      - "3000:3000"


  bot2:
    build: .
    env_file:
      - .env
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
    
    command: ["node", "basket_tr.js"]

    environment:
      DATABASE_URL: postgres://haxball:${DB_PASSWORD}@db:5432/haxball
      DATA_DIR: /data

    volumes:
      - ./data/bot2:/data
      - ./logs:/app/logs

    ports:
      - "3001:3000"


  log-pusher:
    build: .
    restart: unless-stopped

    volumes:
      - ./:/app
      - /app/node_modules
      - ${HOME}/.ssh/id_ed25519_logbot:/root/.ssh/id_ed25519:ro
      - ${HOME}/.ssh/known_hosts:/root/.ssh/known_hosts:ro

    command: ["node", "services/logScheduler.js"]


  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

    depends_on:
      - bot1
      - bot2


volumes:
  pgdata: