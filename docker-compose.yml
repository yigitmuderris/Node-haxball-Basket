  bot2:
    build: .
    env_file:
      - .env
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://haxball:${DB_PASSWORD}@db:5432/haxball
      DATA_DIR: /data
    volumes:
      - ./data/bot2:/data
      - ./logs:/app/logs

  log-pusher:
    build: .
    restart: unless-stopped
    volumes:
      - ./:/app
      - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - ${HOME}/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    command: ["node", "services/logScheduler.js"]

  volumes:
  pgdata: